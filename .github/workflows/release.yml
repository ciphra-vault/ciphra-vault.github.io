# Merging Dependabot's bump of the ref below is the release: the build itself lives in the
# monorepo and runs at exactly the commit pinned here.
name: Release

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
      pages: write
      id-token: write
      attestations: write
    uses: Frozik/portfolio/.github/workflows/vault-release.yml@99615b8b690d43e1388f3f30febb29d6edf26f23 # v2.51.0
    # The APK's signing key: only the monorepo workflow's `sign` job, in the `release` environment, reads it.
    # Named, not `inherit`: inherit passes nothing to a workflow of another owner (Frozik, not this org).
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
